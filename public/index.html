<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Reserva de Salas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Sistema de Reserva de Salas</h1>
        <nav>
            <button onclick="mostrarSessao('salas')">Gerenciar Salas</button>
            <button onclick="mostrarSessao('reservas')">Gerenciar Reservas</button>
        </nav>
    </header>

    <main id="mensagem-alerta"></main>

    <!-- SESSÃO SALAS -->
    <section id="sec-salas" style="display:none;">
        <h2>Cadastro de Salas e Laboratórios</h2>
        <form id="form-sala">
            <input type="text" id="s-nome" placeholder="Nome/Identificação da Sala" required>
            <input type="text" id="s-local" placeholder="Localização (Ex: Bloco A, 1º Andar)" required>
            <input type="number" id="s-capacidade" placeholder="Capacidade Máxima" required>
            <input type="text" id="s-recursos" placeholder="Recursos (Ex: Lousa, Projetor, AC)" required>
            <select id="s-situacao" required>
                <option value="Disponível">Disponível</option>
                <option value="Inativa">Inativa</option>
            </select>
            <button type="submit">Salvar Sala</button>
        </form>

        <table id="tabela-salas">
            <thead>
                <tr><th>Sala</th><th>Local</th><th>Capacidade</th><th>Situação</th><th>Ações</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <!-- SESSÃO RESERVAS -->
    <section id="sec-reservas">
        <h2>Fazer Reserva</h2>
        <form id="form-reserva">
            <input type="text" id="r-aluno" placeholder="Nome do Aluno" required>
            <input type="email" id="r-email" placeholder="E-mail" required>
            <select id="r-sala" required><option value="">Selecione uma sala...</option></select>
            
            <div class="input-grupo">
                <label>Data:</label>
                <input type="date" id="r-data" onchange="verificarFeriado()" required>
                <span id="aviso-feriado" class="alerta-feriado"></span>
            </div>
            
            <div class="input-grupo">
                <label>Das:</label><input type="time" id="r-inicio" required>
                <label>Até as:</label><input type="time" id="r-fim" required>
            </div>
            
            <input type="number" id="r-participantes" placeholder="Qtd. Participantes" required>
            <input type="text" id="r-finalidade" placeholder="Finalidade (Reunião, Estudo...)" required>
            <button type="submit">Confirmar Reserva</button>
        </form>

        <h3>Listagem e Pesquisa de Reservas</h3>
        <div class="filtros">
            <input type="date" id="filtro-data" onchange="carregarReservas()">
            <select id="filtro-sala" onchange="carregarReservas()"><option value="">Todas as Salas</option></select>
        </div>

        <table id="tabela-reservas">
            <thead>
                <tr><th>Aluno</th><th>Sala</th><th>Data e Hora</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
